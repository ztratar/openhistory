name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install isolated ToDesktop toolchain
        run: npm run desktop:tools
      - name: Verify native distribution hooks
        run: npm run desktop:verify
      - name: Build credential-free local application
        run: npm run desktop:package:local
      - name: Verify ToDesktop source archive without uploading
        run: npm run desktop:dry-run

  website:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
